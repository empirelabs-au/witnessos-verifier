[project]
name = "witnessos-verifier"
version = "0.1.0"
description = "Standalone open-source verifier for WitnessOS™ evidence bundles"
readme = "README.md"
license-files = ["LICENSE"]
requires-python = ">=3.12"
authors = [
    {name = "Empire Labs Pty Ltd", email = "contact@empirelabs.com.au"},
]
keywords = ["witnessos", "ai-agents", "evidence", "verification", "audit", "cryptography"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security :: Cryptography",
    "Topic :: Software Development :: Libraries :: Python Modules",
]

dependencies = [
    "click>=8.0",
    "pynacl>=1.5.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
]

[project.scripts]
witnessos-verifier = "witnessos_verifier.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"
