name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
          # Without an explicit output path the SARIF is written to ../results
          # (outside the checkout), so the gate below globbed an empty dir and
          # reported "clean" unconditionally. Pin it inside the workspace.
          output: results
      - name: Fail on CodeQL findings (SARIF gate)
        env:
          # Blocking threshold. Raise to "warning" once the quality warnings from
          # queries: security-and-quality are cleaned up - as of 2026-09-13 the
          # suite reports ~20 of them (py/unused-import, py/empty-except, ...)
          # which are code hygiene, not vulnerabilities. A gate nobody can keep
          # green gets switched off, so warnings are reported, not blocking.
          SAST_FAIL_LEVEL: error
        run: |
          python3 - <<'EOF'
          import json, glob, os, sys
          from collections import Counter
          fail_level = os.environ.get("SAST_FAIL_LEVEL", "error")
          blocking = {"error"} if fail_level == "error" else {"error", "warning"}
          files = sorted(glob.glob('results/*.sarif'))
          if not files:
              sys.exit("SAST gate: no SARIF files found under results/ - cannot verify, failing closed")
          print(f"SAST gate: inspecting {len(files)} SARIF file(s): "
                f"{[os.path.basename(f) for f in files]} (blocking level: {fail_level})")
          findings, warnings = [], []
          for f in files:
              with open(f) as fh:
                  sarif = json.load(fh)
              for run in sarif.get('runs', []):
                  for res in run.get('results', []):
                      lvl = res.get('level', 'warning')
                      locs = res.get('locations', [{}])
                      loc = locs[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '?') if locs else '?'
                      loc = f"{loc}:{locs[0].get('physicalLocation', {}).get('region', {}).get('startLine', '?')}" if locs else loc
                      entry = f"{res.get('ruleId','?')} at {loc}"
                      if lvl in blocking:
                          findings.append(f"{lvl}: {entry}")
                      elif lvl == 'warning':
                          warnings.append(entry)
          if warnings:
              print(f"SAST gate: {len(warnings)} non-blocking warning(s) (informational):")
              for rule, n in Counter(w.split(' at ')[0] for w in warnings).most_common(10):
                  print(f"  - {n} x {rule}")
              for w in warnings[:5]:
                  print(f"    e.g. {w}")
          if findings:
              print(f"CodeQL findings at or above '{fail_level}' (SAST gate FAIL):")
              for x in findings[:20]:
                  print("  -", x)
              sys.exit(1)
          print(f"SAST gate PASS: no findings at or above '{fail_level}' across {len(files)} SARIF file(s)")
          EOF

  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
      - name: Scan dependencies
        run: /tmp/osv-scanner scan -r .
