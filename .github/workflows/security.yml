name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  sast:
    name: SAST (CodeQL)
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v4
        with:
          languages: python
          queries: security-and-quality
      - uses: github/codeql-action/analyze@v4
        with:
          upload: never
      - name: Fail on CodeQL findings (SARIF gate)
        run: |
          python3 - <<'EOF'
          import json, glob, sys
          findings = []
          for f in glob.glob('results/*.sarif'):
              with open(f) as fh:
                  sarif = json.load(fh)
              for run in sarif.get('runs', []):
                  for res in run.get('results', []):
                      lvl = res.get('level', 'warning')
                      if lvl in ('error', 'warning'):
                          locs = res.get('locations', [{}])
                          loc = locs[0].get('physicalLocation', {}).get('artifactLocation', {}).get('uri', '?') if locs else '?'
                          findings.append(f"{lvl}: {res.get('ruleId','?')} at {loc}")
          if findings:
              print("CodeQL findings (SAST gate FAIL):")
              for x in findings[:20]:
                  print("  -", x)
              sys.exit(1)
          print("CodeQL clean: no error/warning findings")
          EOF

  sca:
    name: SCA (OSV-Scanner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install osv-scanner
        run: |
          curl -sSL -o /tmp/osv-scanner https://github.com/google/osv-scanner/releases/download/v2.5.1/osv-scanner_linux_amd64
          chmod +x /tmp/osv-scanner
      - name: Scan dependencies
        run: /tmp/osv-scanner scan -r .
